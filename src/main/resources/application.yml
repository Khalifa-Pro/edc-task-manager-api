spring:
  application:
    name: task-manager-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edc_tasks}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:passer123}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8085